<title>Thám tử hình học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}

/* Layout: one full-screen app. Home → mission map → play (figure stage + side panel, stacked in portrait).
   Single light "paper booklet" look on purpose: it matches the printed Thám tử hình học booklet the child already uses. */
:root{
  --paper:#FFF8EC; --paper-2:#FCEFD9; --card:#FFFFFF; --ink:#23263A; --muted:#6B6F85; --line:#EDE4D3; --dim:#C9CCD8;
  --tri:#FF6B57; --tri-s:#FFE5E0; --tri-d:#D94B39;
  --sq:#3D7BFF;  --sq-s:#E3ECFF;  --sq-d:#2A5FD6;
  --rec:#1FB36B; --rec-s:#DDF5E8; --rec-d:#148A52;
  --cir:#9B5CF6; --cir-s:#EFE6FF; --cir-d:#7A3FD8;
  --seg:#0EA5A4; --seg-s:#D9F4F3; --seg-d:#0B8584;
  --yel:#FFC531; --yel-s:#FFF3CC; --yel-d:#D99A00; --sel:#FFD84D;
  --f-display:'Baloo 2', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
  --f-body:'Lexend', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --kc:var(--tri); --ks:var(--tri-s); --kd:var(--tri-d); --lc:var(--cir); --lcs:var(--cir-s);
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#app{position:relative;height:100%;max-width:1360px;margin:0 auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-block:12px 14px;min-height:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--sq);outline-offset:3px}
svg{display:block}
.mascot-box svg,.friend-box svg{width:100%;height:auto}

/* ---------- shared bits */
.icon-btn{width:52px;height:52px;flex:none;border-radius:16px;background:var(--card);border:2.5px solid var(--line);display:grid;place-items:center}
.icon-btn svg{width:26px;height:26px}
.icon-btn:active{transform:translateY(2px)}
.chip{display:inline-flex;align-items:center;gap:6px;font:800 19px/1 var(--f-display);background:var(--yel-s);border-radius:999px;padding:8px 14px 6px;white-space:nowrap}
.chip svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:#fff;
  font:600 16px/1.3 var(--f-body);padding:12px 20px;border-radius:16px;z-index:40;max-width:min(520px,calc(100% - 32px));text-align:center}

/* ---------- home */
#home{align-items:center;justify-content:center;gap:clamp(8px,2vh,18px);text-align:center;background:
  radial-gradient(ellipse 60% 40% at 50% 46%, var(--yel-s), transparent 70%)}
.h-kicker{font:700 14px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.h-title{margin:0;font:800 clamp(46px, min(10vw, 12vh), 108px)/.9 var(--f-display);letter-spacing:.005em;
  text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink),0 8px 0 var(--ink)}
.h-title span{display:block}
.h-title .l1{color:var(--yel)} .h-title .l2{color:var(--sq)}
.h-stage{position:relative;width:min(620px,100%);height:clamp(170px,32vh,320px)}
.h-stage>div{position:absolute}
.h-stage .mascot-box{left:50%;top:50%;width:clamp(130px,26vh,240px);transform:translate(-50%,-50%)}
.h-stage .friend-box{width:clamp(56px,11vh,104px);animation:bob 3.2s ease-in-out infinite}
.h-stage .fa{left:2%;top:6%} .h-stage .fb{left:15%;bottom:0;animation-delay:-.8s}
.h-stage .fc{right:2%;top:8%;animation-delay:-1.6s} .h-stage .fd{right:14%;bottom:2%;animation-delay:-2.4s}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.idchip{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:2.5px solid var(--line);border-radius:999px;padding:6px 18px 4px 8px;font:800 20px/1 var(--f-display)}
.idchip i{font-style:normal;font:700 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--ink);border-radius:999px;padding:7px 10px 6px}
.play-btn{font:800 clamp(26px,4vh,34px)/1 var(--f-display);background:var(--rec);color:#fff;padding:18px 54px 14px;border-radius:999px;
  box-shadow:0 7px 0 var(--rec-d),0 14px 28px rgba(31,179,107,.32)}
.play-btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--rec-d)}
.h-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}

/* ---------- map */
.topbar{display:flex;align-items:center;gap:12px;min-height:56px}
.topbar .ttl{font:800 clamp(22px,3.4vw,30px)/1 var(--f-display);margin-right:auto}
.map-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 30px;margin-top:6px}
.lvl{margin-top:20px}
.lvl-h{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.lvl-h .badge{font:800 15px/1 var(--f-display);color:#fff;background:var(--lc);border-radius:12px;padding:8px 12px 6px;white-space:nowrap}
.lvl-h b{font:800 22px/1.1 var(--f-display)}
.lvl-h span{color:var(--muted);font-size:14px}
.lvl-h .prog{margin-left:auto;font:700 15px var(--f-display);color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.tile{position:relative;background:var(--card);border:2.5px solid var(--line);border-radius:22px;padding:30px 8px 10px;display:flex;flex-direction:column;
  align-items:center;gap:6px;text-align:center;min-height:184px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .num{position:absolute;left:9px;top:9px;width:32px;height:32px;border-radius:50%;background:var(--lc);color:#fff;font:800 17px/33px var(--f-display)}
.tile .pv{width:100px;height:72px;display:grid;place-items:center}
.tile .pv svg{max-width:100%;max-height:100%}
.tile .nm{font:700 15px/1.2 var(--f-display);text-wrap:balance}
.tile .st{display:flex;gap:3px;margin-top:auto}
.tile .st svg{width:22px;height:22px}
.tile.locked{background:var(--paper-2);border-style:dashed}
.tile.locked .pv,.tile.locked .nm,.tile.locked .st{opacity:.35}
.tile .lock{position:absolute;right:10px;top:10px;width:26px;height:26px;color:var(--muted)}
.tile.next{border-color:var(--lc);box-shadow:0 0 0 5px var(--lcs);animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-4px)}}

/* ---------- play */
.bar{display:flex;align-items:center;gap:12px;min-height:56px}
.bar .tt{flex:1;min-width:0}
.bar .tt small{display:block;font:700 12px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--lc)}
.bar .tt b{display:block;font:800 clamp(20px,3vw,26px)/1.15 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part{font:700 14px/1 var(--f-display);color:var(--muted);background:var(--card);border:2.5px solid var(--line);border-radius:999px;padding:9px 14px 7px;white-space:nowrap}
.play-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,350px);gap:14px;margin-top:10px}
.stage{position:relative;display:flex;flex-direction:column;background:var(--card);border:2.5px solid var(--line);border-radius:28px;min-height:0;overflow:hidden}
.fig-wrap{position:relative;flex:1;min-height:0;margin:10px 12px 0}
#fig{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
#fig *{pointer-events:none}
#fig .face{fill:transparent;transition:fill .12s}
#fig .face.sel{fill:var(--sel);fill-opacity:.9}
#fig .face.bad{fill:var(--tri);fill-opacity:.35}
#fig .lines line{stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;vector-effect:non-scaling-stroke}
#fig .circles circle{fill:none;stroke:var(--ink);stroke-width:4.5;vector-effect:non-scaling-stroke}
#fig .circles circle.got{stroke:var(--cir);fill:var(--cir-s)}
#fig .pts circle{fill:var(--ink)}
#fig .pts.hide{display:none}
#fig .pts circle.on{fill:var(--sel);stroke:var(--ink);stroke-width:3;vector-effect:non-scaling-stroke}
#fig .pts circle.got{fill:var(--seg)}
#fig .lbl{font-family:var(--f-body);font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
#fig .fl{stroke-width:6;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;animation:flash 1.7s ease-out forwards}
#fig .fl.again{animation-duration:1.1s}
@keyframes flash{0%{fill-opacity:.7;stroke-opacity:1}70%{fill-opacity:.5;stroke-opacity:1}100%{fill-opacity:0;stroke-opacity:0}}
#fig .ghost{fill:var(--yel);fill-opacity:.25;stroke:var(--yel-d);stroke-width:5;stroke-dasharray:10 8;vector-effect:non-scaling-stroke;animation:ghost .5s ease-in-out 5 alternate forwards}
@keyframes ghost{from{fill-opacity:.05;stroke-opacity:.3}to{fill-opacity:.4;stroke-opacity:1}}
#fig.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.pick-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:12px;padding:6px}
.pcard{position:relative;background:var(--paper);border:3px solid var(--line);border-radius:22px;display:grid;place-items:center;color:var(--ink);min-height:0}
.pcard svg{width:min(78%,140px);height:auto;max-height:82%}
.pcard.got{border-color:var(--kc);background:var(--ks);color:var(--kd)}
.pcard .ok{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--kc);display:grid;place-items:center}
.pcard .ok svg{width:18px;height:18px}
.pcard.no{animation:shake .38s;border-color:var(--tri)}
.pcard.blink{animation:blink .45s ease-in-out 6 alternate}
@keyframes blink{to{border-color:var(--yel);box-shadow:0 0 0 6px var(--yel-s)}}
.buddy{display:flex;align-items:flex-end;gap:10px;padding:6px 14px 12px}
.buddy .mascot-box{width:clamp(64px,10vh,88px);flex:none}
.buddy .mascot-box.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-12px) rotate(-4deg)}}
.say{position:relative;flex:1;min-width:0;background:var(--paper);border:2.5px solid var(--line);border-radius:20px 20px 20px 6px;padding:11px 15px 10px;
  font:600 clamp(15px,2.1vh,18px)/1.38 var(--f-body);min-height:48px}
.say.good{background:var(--rec-s);border-color:#B9E8CF} .say.bad{background:var(--tri-s);border-color:#FFCABF}
.say.info{background:var(--sq-s);border-color:#C7D8FF} .say.guide{background:var(--yel-s);border-color:#F5DC8E}
.say b{font-weight:700}

.panel{display:flex;flex-direction:column;gap:12px;min-height:0}
.card{background:var(--card);border:2.5px solid var(--line);border-radius:24px;padding:14px 16px}
.task{display:flex;gap:14px;align-items:center}
.task .kic{width:56px;height:56px;flex:none;border-radius:18px;background:var(--ks);display:grid;place-items:center}
.task .kic svg{width:34px;height:34px}
.task-k{font:600 13px/1.2 var(--f-body);color:var(--muted)}
.task-t{font:800 clamp(22px,3vh,28px)/1.05 var(--f-display);color:var(--kd)}
.task-n{font:500 13px/1.35 var(--f-body);color:var(--muted);margin-top:3px}
.meter{display:flex;align-items:center;gap:12px;margin-top:12px}
.pips{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.pips svg{width:20px;height:20px}
.cnt{font:800 34px/1 var(--f-display);white-space:nowrap}
.cnt span{color:var(--muted);font-size:22px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-main{grid-column:1/-1;font:800 clamp(24px,3.4vh,30px)/1 var(--f-display);background:var(--kc);color:#fff;border-radius:22px;padding:18px 10px 14px;
  box-shadow:0 6px 0 var(--kd);display:flex;align-items:center;justify-content:center;gap:10px}
.btn-main svg{width:30px;height:30px}
.btn-main:active{transform:translateY(4px);box-shadow:0 2px 0 var(--kd)}
.btn-main:disabled{opacity:.4;box-shadow:0 6px 0 var(--kd);transform:none}
.btn-main.go{background:var(--rec);box-shadow:0 6px 0 var(--rec-d)}
.btn-soft{font:700 17px/1 var(--f-display);background:var(--card);border:2.5px solid var(--line);border-radius:18px;padding:13px 8px 10px;
  display:flex;align-items:center;justify-content:center;gap:7px}
.btn-soft svg{width:22px;height:22px}
.btn-soft:active{transform:translateY(2px)}
.trapq{grid-column:1/-1;font:800 22px/1.2 var(--f-display);text-align:center;padding:4px 0 2px}
.btn-yes,.btn-no{font:800 26px/1 var(--f-display);border-radius:20px;padding:18px 8px 14px;color:var(--ink);background:var(--card);border:3px solid var(--kc);box-shadow:0 6px 0 var(--ks)}
.btn-yes:active,.btn-no:active{transform:translateY(4px)}
.tray{flex:1;min-height:110px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tray-h{font:700 13px/1.2 var(--f-body);color:var(--muted);margin-bottom:4px}
.tray-empty{font-size:14px;color:var(--muted);line-height:1.45;padding:6px 0}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 0;border-top:2px dashed var(--line)}
.grp:first-of-type{border-top:0}
.grp .gl{font:800 15px/1.1 var(--f-display);color:var(--kd);min-width:64px}
.grp .gl small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.thumb{border-radius:10px;border:2px solid var(--line);background:#fff;padding:0}
.thumb:active{border-color:var(--kc)}
.pthumb{width:48px;height:48px;display:grid;place-items:center}
.sumline{margin-top:8px;padding-top:8px;border-top:2px solid var(--line);font:800 18px/1.3 var(--f-display);color:var(--ink)}
.sumline b{color:var(--kd)}

/* ---------- overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px));
  background:rgba(35,38,58,.42)}
.dcard{position:relative;background:var(--card);border-radius:32px;padding:22px 26px 24px;width:min(560px,100%);max-height:100%;overflow:auto;text-align:center;
  box-shadow:0 24px 70px rgba(20,22,40,.3)}
.dcard .mascot-box{width:120px;margin:-6px auto 0}
.dcard h2{margin:2px 0 6px;font:800 38px/1 var(--f-display)}
.dstars{display:flex;justify-content:center;gap:12px;margin:6px 0 12px}
.dstars svg{width:64px;height:64px}
.dstars .on{animation:pop .55s cubic-bezier(.3,1.6,.5,1) backwards}
.dstars .on:nth-child(2){animation-delay:.18s} .dstars .on:nth-child(3){animation-delay:.36s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.dsum{display:flex;flex-direction:column;gap:8px;margin:4px 0 16px}
.dsum div{display:flex;align-items:center;justify-content:center;gap:10px;font:700 19px/1.25 var(--f-display);background:var(--paper);border-radius:16px;padding:9px 12px 7px}
.dsum svg{width:24px;height:24px;flex:none}
.dbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dbtns button{font:800 19px/1 var(--f-display);border-radius:18px;padding:15px 20px 12px;background:var(--card);border:2.5px solid var(--line)}
.dbtns .primary{background:var(--rec);border-color:var(--rec);color:#fff;box-shadow:0 5px 0 var(--rec-d)}
.pcard-in{text-align:left}
.pcard-in h2{text-align:center}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:2px solid var(--line);font:600 16px/1.35 var(--f-body)}
.prow small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.sw{position:relative;width:58px;height:34px;flex:none;border-radius:999px;background:var(--dim);transition:background .15s}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--rec)} .sw[aria-checked="true"]::after{transform:translateX(24px)}
.btn-danger{font:700 16px/1 var(--f-display);border:2.5px solid #FFCABF;color:var(--tri-d);background:var(--tri-s);border-radius:14px;padding:11px 14px 9px;flex:none}

/* ---------- tutorial hand + confetti */
.hand{position:fixed;z-index:25;width:64px;height:64px;pointer-events:none;transition:left .35s ease,top .35s ease}
.hand .ring{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;border:4px solid var(--yel);animation:ring 1.2s ease-out infinite}
.hand svg{position:absolute;left:-17px;top:-4px;width:56px;height:56px;animation:tap 1.2s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(1.4);opacity:0}}
@keyframes tap{50%{transform:translate(4px,8px) scale(.94)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35}

/* ---------- portrait / small screens */
@media (max-aspect-ratio: 1/1){
  .play-body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(260px,1fr) auto}
  .panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .panel .tray{grid-column:1/-1;max-height:150px;min-height:0}
  .pick-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width: 620px){
  .screen{overflow-y:auto}
  .play-body{grid-template-rows:minmax(300px,48vh) auto}
  .panel{grid-template-columns:minmax(0,1fr)}
  .pick-grid{gap:8px;padding:2px}
  .pcard{border-radius:16px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .part{display:none}
  .topbar .ttl{font-size:20px}
}
@media (max-height: 700px) and (min-aspect-ratio: 1/1){
  .buddy .mascot-box{width:56px} .say{font-size:14px;min-height:40px;padding:8px 12px}
  .card{padding:11px 13px} .btn-main{padding:14px 10px 11px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}

function inPoly(pt, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > pt.y) !== (yj > pt.y) && pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
const faceAt = p => G.fig.faces.findIndex(poly => inPoly(p, poly));
function pointAt(p) {
  const lim = pxToFig(34); let best = -1, bd = Infinity;
  G.fig.points.forEach(([x, y], i) => { const d = Math.hypot(x - p.x, y - p.y); if (d < bd) { bd = d; best = i; } });
  return bd <= lim ? best : -1;
}
function circleAt(p) {
  const C = G.fig.circles, ins = [];
  C.forEach(([cx, cy, r], i) => { const d = Math.hypot(cx - p.x, cy - p.y); if (d <= r + pxToFig(14)) ins.push([d, i]); });
  if (ins.length) return ins.sort((a, b) => a[0] - b[0])[0][1];
  return -1;
}

svg.addEventListener('pointerdown', e => {
  if (!G || G.pick || G.done || G.n === 0) return;
  const p = toFig(e);
  if (SHAPE_KINDS.includes(G.kind)) {
    const i = faceAt(p); if (i < 0) return;
    e.preventDefault();
    G.paint = !G.sel.has(i); G.stroke = new Set([i]); applyFace(i, G.paint);
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  } else if (G.kind === 'seg') { const i = pointAt(p); if (i >= 0) tapPoint(i); }
  else if (G.kind === 'pt') { const i = pointAt(p); if (i >= 0) tapDot(i); }
  else if (G.kind === 'circ') { const i = circleAt(p); if (i >= 0) tapCircle(i); }
});
svg.addEventListener('pointermove', e => {
  if (!G || !G.stroke) return;
  const i = faceAt(toFig(e));
  if (i >= 0 && !G.stroke.has(i)) { G.stroke.add(i); applyFace(i, G.paint); }
});
const endStroke = () => { if (G && G.stroke) { G.stroke = null; } };
svg.addEventListener('pointerup', endStroke); svg.addEventListener('pointercancel', endStroke);

function applyFace(i, on) {
  if (on) G.sel.add(i); else G.sel.delete(i);
  G.faceEls[i].classList.toggle('sel', on);
  G.faceEls[i].classList.remove('bad');
  Sound.tap(); updateCheck(); guideEvent('sel');
}
function clearSel() {
  if (!G.sel) return;
  for (const i of G.sel) G.faceEls[i].classList.remove('sel', 'bad');
  G.sel.clear(); updateCheck();
}
function shake() { svg.classList.remove('shake'); void svg.getBBox(); svg.classList.add('shake'); setTimeout(() => svg.classList.remove('shake'), 420); }
function flashPoly(poly, k, again) {
  const K = KIND[k];
  const p = el('polygon', {points: ptsStr(poly), class: 'fl' + (again ? ' again' : ''), fill: K.hex, stroke: K.dark}, G.flashG);
  setTimeout(() => p.remove(), again ? 1150 : 1750);
}
function flashSeg(a, b, k, again) {
  const A = G.fig.points[a], B = G.fig.points[b], K = KIND[k];
  const l = el('line', {x1: A[0], y1: A[1], x2: B[0], y2: B[1], class: 'fl' + (again ? ' again' : ''), stroke: K.hex, fill: 'none'}, G.topG);
  l.style.strokeWidth = '9';
  setTimeout(() => l.remove(), again ? 1150 : 1750);
}
function replay(j) {
  const f = G.fig, k = G.kind;
  if (SHAPE_KINDS.includes(k)) flashPoly(f.shapes[k][j].p, k, true);
  else if (k === 'seg') flashSeg(f.segs[j].a, f.segs[j].b, k, true);
}
function remaining() { return G.n - G.found.size; }
function praise(extra) {
  const left = remaining();
  say(`${pickOne(GOOD)} ${extra || ''} ${left ? `Còn <b>${left}</b> ${KIND[G.kind].name} nữa.` : ''}`, 'good');
}
function check() {
  if (!G.sel.size || G.done) return;
  const key = [...G.sel].sort((a, b) => a - b).join(',');
  const hit = G.fig.keyMap[key], K = KIND[G.kind];
  if (hit && hit.k === G.kind) {
    const poly = G.fig.shapes[hit.k][hit.j].p;
    if (G.found.has(hit.j)) { Sound.info(); flashPoly(poly, hit.k, true); clearSel(); say('Hình này con tìm rồi. Tìm hình khác nhé!', 'info'); return; }
    G.found.add(hit.j); G.hint = 0;
    Sound.good(); flashPoly(poly, hit.k); clearSel(); renderTask(); renderTray();
    if (!remaining()) return huntDone();
    praise(); guideEvent('ok');
    return;
  }
  G.errors++; Sound.bad(); shake();
  for (const i of G.sel) G.faceEls[i].classList.add('bad');
  if (hit) {
    if (G.kind === 'rect' && hit.k === 'sq') say('Đây là <b>hình vuông</b>. Hình vuông được đếm riêng, con tìm hình chữ nhật dài hơn nhé.', 'bad');
    else if (G.kind === 'sq' && hit.k === 'rect') say('Đây là <b>hình chữ nhật</b>: 2 cạnh dài, 2 cạnh ngắn. Chưa phải hình vuông.', 'bad');
    else say(`Đây là <b>${KIND[hit.k].name}</b>. Mình đang tìm ${K.name} cơ!`, 'bad');
  } else say(`Các mảnh này chưa ghép thành ${K.name}. Bỏ bớt hoặc thêm mảnh rồi thử lại nhé!`, 'bad');
}

/* segments: tap two end points */
function markPts() {
  G.ptEls.forEach((c, i) => c.classList.toggle('on', G.selPts.includes(i)));
}
function tapPoint(i) {
  Sound.tap();
  if (G.selPts.length === 1 && G.selPts[0] === i) { G.selPts = []; markPts(); return; }
  G.selPts.push(i); markPts();
  if (G.selPts.length === 1) guideEvent('point', i);
  if (G.selPts.length === 2) {
    const [a, b] = G.selPts;
    setTimeout(() => { G.selPts = []; markPts(); checkSeg(a, b); }, 160);
  }
}
const segName = j => { const s = G.fig.segs[j], n = G.fig.nameOf; return (n[s.a] && n[s.b]) ? `Đoạn <b>${[n[s.a], n[s.b]].sort().join('')}</b>.` : ''; };
function checkSeg(a, b) {
  const j = G.fig.segKey[Math.min(a, b) + '-' + Math.max(a, b)];
  if (j === undefined) {
    G.errors++; Sound.bad(); shake();
    say('Hai điểm này không nằm trên cùng một đường kẻ thẳng. Thử hai điểm khác nhé!', 'bad'); return;
  }
  if (G.found.has(j)) { Sound.info(); flashSeg(a, b, 'seg', true); say('Đoạn thẳng này con tìm rồi.', 'info'); return; }
  G.found.add(j); G.hint = 0; Sound.good(); flashSeg(a, b, 'seg'); renderTask(); renderTray();
  if (!remaining()) return huntDone();
  praise(segName(j)); guideEvent('seg');
}
function tapDot(i) {
  if (G.found.has(i)) { Sound.info(); say('Điểm này con chạm rồi.', 'info'); return; }
  G.found.add(i); G.hint = 0; G.ptEls[i].classList.add('got'); Sound.good(); renderTask(); renderTray();
  if (!remaining()) return huntDone();
  const nm = G.fig.nameOf[i];
  praise(nm ? `Điểm <b>${nm}</b>.` : '');
}
function tapCircle(i) {
  if (G.found.has(i)) { Sound.info(); say('Hình tròn này con tìm rồi.', 'info'); return; }
  G.found.add(i); G.hint = 0; G.circEls[i].classList.add('got'); Sound.good(); renderTask(); renderTray();
  if (!remaining()) return huntDone();
  praise();
}

/* hints: first a counting tip, then show one hidden shape */
function hint() {
  Sound.tap(); G.hint++;
  const f = G.fig, k = G.kind, K = KIND[k];
  if (G.pick) {
    const left = G.m.pick.items.map((it, j) => j).filter(j => G.m.pick.items[j].ok && !G.found.has(j));
    if (!left.length) return;
    G.helps++; const c = $('#pickGrid').children[left[0]];
    c.classList.remove('blink'); void c.offsetWidth; c.classList.add('blink');
    say('Nhìn ô đang nhấp nháy nhé!', 'info'); return;
  }
  if (SHAPE_KINDS.includes(k)) {
    const un = f.shapes[k].map((s, j) => ({s, j})).filter(o => !G.found.has(o.j)).sort((a, b) => a.s.f.length - b.s.f.length);
    if (!un.length) return;
    const np = un[0].s.f.length, cnt = un.filter(o => o.s.f.length === np).length;
    if (G.hint === 1) {
      say(np === 1 ? `Gợi ý: còn <b>${cnt}</b> ${K.name} chỉ gồm <b>1 mảnh</b>.` : `Gợi ý: còn <b>${cnt}</b> ${K.name} ghép từ <b>${np} mảnh</b>.`, 'info');
    } else {
      G.helps++;
      const p = el('polygon', {points: ptsStr(un[0].s.p), class: 'ghost'}, G.flashG);
      setTimeout(() => p.remove(), 2700);
      say('Nhìn chỗ nhấp nháy! Tô đúng các mảnh đó rồi bấm Kiểm tra.', 'info');
    }
    return;
  }
  if (k === 'seg') {
    const un = f.segs.map((s, j) => ({s, j})).filter(o => !G.found.has(o.j)).sort((a, b) => a.s.u - b.s.u);
    if (!un.length) return;
    const u = un[0].s.u, cnt = un.filter(o => o.s.u === u).length;
    if (G.hint === 1) say(`Gợi ý: còn <b>${cnt}</b> đoạn thẳng đi qua <b>${u + 1} điểm</b>.`, 'info');
    else {
      G.helps++;
      for (const i of [un[0].s.a, un[0].s.b]) blinkPoint(i);
      say('Hai điểm nhấp nháy là hai đầu của một đoạn thẳng con chưa tìm.', 'info');
    }
    return;
  }
  const idx = (k === 'circ' ? f.circles : f.points).map((_, i) => i).filter(i => !G.found.has(i));
  if (!idx.length) return;
  G.helps++;
  if (k === 'circ') {
    const [cx, cy, r] = f.circles[idx[0]];
    const c = el('circle', {cx, cy, r, class: 'ghost'}, G.topG); setTimeout(() => c.remove(), 2700);
  } else blinkPoint(idx[0]);
  say('Nhìn chỗ nhấp nháy nhé!', 'info');
}
function blinkPoint(i) {
  const [x, y] = G.fig.points[i];
  const c = el('circle', {cx: x, cy: y, r: G.unitM * .05, class: 'ghost'}, G.topG);
  setTimeout(() => c.remove(), 2700);
}

/* trap: the answer is 0 */
function trapAnswer(yes) {
  if (G.done) return;
  const K = KIND[G.kind];
  if (!yes) {
    Sound.good(); G.done = true;
    say(`Đúng! Không có ${K.name} nào cả, tức là <b>0</b> ${K.name}. Con không bị lừa!`, 'good');
    G.sums.push({k: G.kind, n: 0, eq: '0', trap: true});
    burst(); setActions('next'); hideHand();
    return;
  }
  G.errors++; Sound.bad();
  say(G.kind === 'sq' ? 'Nhìn kỹ lại nhé: hình vuông phải có <b>4 cạnh bằng nhau</b> và 4 góc vuông. Hình dài hơn rộng hay hình thoi dẹt đều không phải.' :
      `Nhìn kỹ lại nhé: con thử tìm xem có ${K.name} nào thật không?`, 'bad');
}

function huntDone() {
  G.done = true; updateCheck(); hideHand(); G.guide = null;
  Sound.win(); burst();
  const eq = equation(), K = KIND[G.kind];
  G.sums.push({k: G.kind, n: G.n, eq});
  say(eq.includes('+') ? `Xong! Con tìm đủ rồi: <b>${eq}</b> ${K.name}.` : `Xong! Con tìm đủ <b>${G.n}</b> ${K.name}.`, 'good');
  renderTray(); setActions('next');
}
function missionDone() {
  const pen = G.errors + 2 * G.helps;
  const stars = pen <= 1 ? 3 : pen <= 4 ? 2 : 1;
  const m = G.m;
  store.stars[m.id] = Math.max(store.stars[m.id] || 0, stars); save();
  $('#dTitle').textContent = stars === 3 ? 'Xuất sắc!' : stars === 2 ? 'Giỏi lắm!' : 'Hoàn thành!';
  $('#dStars').innerHTML = [0, 1, 2].map(i => starSVG(i < stars)).join('');
  $('#dSum').innerHTML = G.sums.map(s => `<div>${kindIcon(s.k, KIND[s.k].dark, true)}<span>${
    s.trap ? `0 ${KIND[s.k].name} (câu bẫy)` : s.eq.includes('+') ? `${s.eq} ${KIND[s.k].name}` : `${s.n} ${KIND[s.k].name}`}</span></div>`).join('');
  const nxt = G.i + 1 < DATA.missions.length ? G.i + 1 : -1;
  $('#dNext').hidden = nxt < 0;
  $('#dNext').onclick = () => { Sound.tap(); $('#done').hidden = true; startMission(nxt); };
  $('#dAgain').onclick = () => { Sound.tap(); $('#done').hidden = true; startMission(G.i); };
  $('#dMap').onclick = () => { Sound.tap(); $('#done').hidden = true; renderMap(); };
  $('#done').hidden = false;
  Sound.win(); burst(true);
}

/* ---------- "Ai là ...?" picking games */
function startPick() {
  const m = G.m, P = m.pick;
  Object.assign(G, {kind: m.kind, n: P.items.filter(x => x.ok).length, found: new Set(), done: false, pick: true, hint: 0, hi: 0, sel: null, fig: null});
  setColors(m.lv, m.kind);
  svg.style.display = 'none'; svg.innerHTML = '';
  const grid = $('#pickGrid'); grid.hidden = false; grid.innerHTML = '';
  P.items.forEach((it, j) => {
    const b = document.createElement('button');
    b.className = 'pcard'; b.setAttribute('aria-label', 'Hình ' + (j + 1));
    b.innerHTML = `<svg viewBox="0 0 100 100">${it.svg}</svg>`;
    b.addEventListener('click', () => pickTap(j, b));
    grid.appendChild(b);
  });
  renderTask(); renderTray(); setActions('tapper');
  $('#btnClear').hidden = true; $('#btnHint').style.gridColumn = '1 / -1';
  say(P.ask + '. ' + P.rule, 'info');
}
function pickTap(j, b) {
  if (G.done) return;
  const it = G.m.pick.items[j];
  if (it.ok) {
    if (G.found.has(j)) { Sound.info(); say('Hình này con chọn rồi.', 'info'); return; }
    G.found.add(j); Sound.good(); b.classList.add('got');
    b.insertAdjacentHTML('beforeend', `<span class="ok">${UI.check}</span>`);
    renderTask(); renderTray();
    if (!remaining()) return huntDone();
    praise();
  } else {
    G.errors++; Sound.bad();
    b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); setTimeout(() => b.classList.remove('no'), 700);
    say('Chưa đúng: ' + it.why.charAt(0).toLowerCase() + it.why.slice(1), 'bad');
  }
}

/* ---------- tutorial guide */
const hand = $('#hand');
function hideHand() { hand.hidden = true; }
function handTo(x, y) { hand.style.left = x + 'px'; hand.style.top = y + 'px'; hand.hidden = false; }
function guideSkip() {
  const g = G.guide;
  while (g && g.i < g.steps.length) {
    const st = g.steps[g.i];
    if (st.t === 'face') {
      const hit = G.fig.keyMap[[...st.f].sort((a, b) => a - b).join(',')];
      if (hit && G.found.has(hit.j)) { g.i += 2; continue; }
    }
    if (st.t === 'point' && G.found.size > 0) { g.i = g.steps.findIndex(s => s.t === 'free'); continue; }
    break;
  }
}
function guideShow() {
  const g = G && G.guide; if (!g) return hideHand();
  guideSkip();
  const st = g.steps[g.i];
  if (!st) { G.guide = null; hideHand(); return; }
  say(st.say, 'guide');
  requestAnimationFrame(() => {
    if (!G.guide) return;
    if (st.t === 'face') {
      const target = st.f.find(i => !G.sel.has(i));
      if (target === undefined) return hideHand();
      const [x, y] = G.fig.ipts[target], c = figToClient(x, y); handTo(c.x, c.y);
    } else if (st.t === 'check') {
      const r = $('#btnCheck').getBoundingClientRect(); handTo(r.left + r.width * .62, r.top + r.height * .55);
    } else if (st.t === 'point') {
      const [x, y] = G.fig.points[st.p], c = figToClient(x, y); handTo(c.x, c.y);
    } else { hideHand(); G.guide = null; }
  });
}
function guideEvent(type, arg) {
  const g = G && G.guide; if (!g) return;
  const st = g.steps[g.i]; if (!st) return;
  const same = (s, arr) => s.size === arr.length && arr.every(i => s.has(i));
  if (type === 'sel') {
    if (st.t === 'face' && same(G.sel, st.f)) g.i++;
    else if (st.t === 'check' && g.i > 0 && g.steps[g.i - 1].t === 'face' && !same(G.sel, g.steps[g.i - 1].f)) g.i--;
    guideShow();
  } else if (type === 'ok' && st.t === 'check') { g.i++; guideShow(); }
  else if (type === 'point' && st.t === 'point' && arg === st.p) { g.i++; guideShow(); }
  else if (type === 'seg') { const fi = g.steps.findIndex(s => s.t === 'free'); if (st.t === 'point' && fi >= 0) g.i = fi; guideShow(); }
  else if (type === 'ok') guideShow();
}
window.addEventListener('resize', () => { if (G && G.guide) guideShow(); });

/* ---------- confetti made of little shapes */
const fx = $('#fx'), fctx = fx.getContext('2d');
let parts = [], fxOn = false;
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(big) {
  if (reduce) return;
  const W = fx.width = innerWidth * devicePixelRatio, H = fx.height = innerHeight * devicePixelRatio;
  const cols = ['#FF6B57', '#3D7BFF', '#1FB36B', '#9B5CF6', '#FFC531', '#0EA5A4'];
  const n = big ? 110 : 46;
  for (let i = 0; i < n; i++) {
    parts.push({x: W * (big ? Math.random() : .25 + Math.random() * .5), y: big ? -20 : H * .55, vx: (Math.random() - .5) * 9 * devicePixelRatio,
      vy: (big ? Math.random() * 3 : -10 - Math.random() * 9) * devicePixelRatio, r: (6 + Math.random() * 7) * devicePixelRatio,
      a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[i % cols.length], s: i % 3, life: 0});
  }
  if (!fxOn) { fxOn = true; requestAnimationFrame(stepFx); }
}
function stepFx() {
  const W = fx.width, H = fx.height;
  fctx.clearRect(0, 0, W, H);
  parts = parts.filter(p => p.life < 150 && p.y < H + 40);
  for (const p of parts) {
    p.life++; p.vy += .35 * devicePixelRatio; p.x += p.vx; p.y += p.vy; p.a += p.va; p.vx *= .99;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.a); fctx.fillStyle = p.c; fctx.globalAlpha = Math.min(1, (150 - p.life) / 40);
    fctx.beginPath();
    if (p.s === 0) { fctx.moveTo(0, -p.r); fctx.lineTo(p.r * .9, p.r * .7); fctx.lineTo(-p.r * .9, p.r * .7); fctx.closePath(); }
    else if (p.s === 1) fctx.rect(-p.r * .7, -p.r * .7, p.r * 1.4, p.r * 1.4);
    else fctx.arc(0, 0, p.r * .7, 0, Math.PI * 2);
    fctx.fill(); fctx.restore();
  }
  if (parts.length) requestAnimationFrame(stepFx); else { fxOn = false; fctx.clearRect(0, 0, W, H); }
}

/* ---------- wiring */
function soundIcon() { $('#btnSound').innerHTML = store.sound ? UI.sound : UI.mute; $('#swSound').setAttribute('aria-checked', String(store.sound)); }
$('#btnPlay').onclick = () => { Sound.unlock(); Sound.tap(); renderMap(); };
$('#mapHome').innerHTML = UI.home; $('#mapHome').onclick = () => { Sound.tap(); renderHome(); };
$('#btnBack').innerHTML = UI.map; $('#btnBack').onclick = () => { Sound.tap(); hideHand(); renderMap(); };
$('#btnParent').innerHTML = UI.gear;
$('#btnParent').onclick = () => { Sound.tap(); $('#swUnlock').setAttribute('aria-checked', String(store.unlock)); soundIcon(); resetArm = false; $('#btnReset').textContent = 'Xoá'; $('#parent').hidden = false; };
$('#swUnlock').onclick = () => { store.unlock = !store.unlock; save(); $('#swUnlock').setAttribute('aria-checked', String(store.unlock)); };
$('#swSound').onclick = () => { store.sound = !store.sound; save(); soundIcon(); };
$('#btnSound').onclick = () => { store.sound = !store.sound; save(); soundIcon(); Sound.tap(); };
let resetArm = false;
$('#btnReset').onclick = () => {
  if (!resetArm) { resetArm = true; $('#btnReset').textContent = 'Bấm lần nữa để xoá'; return; }
  store.stars = {}; save(); resetArm = false; $('#btnReset').textContent = 'Đã xoá'; toast('Đã xoá tiến độ trên máy này.');
};
$('#pClose').onclick = () => { $('#parent').hidden = true; renderMap(); };
fillArt(); soundIcon();

/* test & update hooks */

function boot(data) {
  try {
    if (data && data.screen === 'play' && Number.isInteger(data.mi)) return startMission(data.mi);
    if (data && data.screen === 'map') return renderMap();
  } catch (e) {}
  renderHome();
}
try { window.claude?.hot?.snapshot?.(() => ({screen: cur.screen, mi: G ? G.i : null})); } catch (e) {}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot(hot && hot.data ? hot.data : {});
})();
</script>
